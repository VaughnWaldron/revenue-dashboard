[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

# Client-side routing fallback for /admin and /report/:slug.
# Explicit function paths (declared via `config.path` in each function)
# take precedence over this catch-all, so /api/* is unaffected.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
